<div class='app-layout' [class.app-layout--dimmed]='settingsWindowOpen()'>
  <div class='app-top-bar px-4 pt-3'>
    @if (electron.isElectron) {
      <div class='window-chrome'>
        <button type='button' class='chrome-menu-btn' (click)='onChromeFileMenu($event)'>File</button>
        <button type='button' class='chrome-menu-btn' (click)='onChromeHelpMenu($event)'>Help</button>
        <h1 class='title-glow chrome-title' (dblclick)='onWindowToggleMaximize()'>&gt; Clara Coder_</h1>
        <button
          type='button'
          class='chrome-win-btn chrome-pin-btn'
          [class.chrome-pin-btn--active]='pinned()'
          (click)='togglePinned()'
          [attr.aria-pressed]='pinned()'
          [attr.aria-label]='pinned() ? "Unpin window" : "Pin window on top"'
          title='Pin window on top'
        >
          <lucide-icon name='pin' [size]='16' class='chrome-pin-icon'></lucide-icon>
        </button>
        <button type='button' class='chrome-win-btn' (click)='onWindowMinimize()' aria-label='Minimize'>&#8722;</button>
        <button type='button' class='chrome-win-btn' (click)='onWindowToggleMaximize()' [attr.aria-label]='windowMaximized() ? "Restore" : "Maximize"'>
          {{ windowMaximized() ? '⧉' : '▢' }}
        </button>
        <button type='button' class='chrome-win-btn chrome-win-close' (click)='onWindowClose()' aria-label='Close'>×</button>
      </div>
    } @else {
      <p class='browser-only-hint'>
        This tab is a browser preview only — close it and use the <strong>Clara Coder</strong> Electron window from <code>npm run dev</code> for File/Help menus, window controls, and workspaces.
      </p>
      <h1 class='title-glow title-glow--solo'>&gt; Clara Coder_</h1>
    }
  </div>

  <div class='app-content'>
    <div class='workspace-panel' [style.width.px]='workspaceWidth()'>
      <app-workspace
        [workspaces]='workspaces()'
        [currentWorkspaceId]='currentWorkspaceId()'
        [activeConversationId]='activeConversationId()'
        [activeFileRelativePath]='activeFileRelativePath()'
        (workspaceChanged)='onWorkspaceChanged($event)'
        (addWorkspace)='onAddWorkspace()'
        (workspaceFileOpen)='onWorkspaceFileOpen($event)'
        (addToChatContext)='addChatContextFile($event.absolutePath)'
      />
    </div>

    <div class='workspace-resize-handle' (mousedown)='onWorkspaceResizeStart($event)'></div>

    <div class='chat-area'>
      <section class='chat-area__stage'>
        <div class='chat-area__tabs' role='presentation'>
        <div class='chat-area__tab-strip' role='tablist' aria-label='Chat and files'>
          <div class='chat-area__tab-strip-tabs'>
          <button
            type='button'
            class='chat-main-tab chat-main-tab--conversation'
            role='tab'
            [attr.aria-selected]='activeMainTabId() === "conversation"'
            [class.chat-main-tab--active]='activeMainTabId() === "conversation"'
            (click)='selectMainTab("conversation")'
          >
            <span class='chat-main-tab-label'>{{ conversationTabTitle() }}</span>
          </button>
          @for (tab of fileTabs(); track tab.relativePath) {
            <button
              type='button'
              class='chat-main-tab'
              role='tab'
              [attr.aria-selected]='activeMainTabId() === fileTabIdForPath(tab.relativePath)'
              [class.chat-main-tab--active]='activeMainTabId() === fileTabIdForPath(tab.relativePath)'
              (click)='selectMainTab(fileTabIdForPath(tab.relativePath))'
            >
              <span class='chat-main-tab-label'>{{ fileTabBasenameForPath(tab.relativePath) }}</span>
              @if (fileTabIsUnsaved(tab.relativePath)) {
                <span class='chat-main-tab-unsaved' aria-label='Unsaved changes' title='Unsaved changes'>●</span>
              }
              <span
                class='chat-main-tab-close'
                role='presentation'
                (click)='closeMainFileTab($event, fileTabIdForPath(tab.relativePath))'
                title='Close tab'
              >&times;</span>
            </button>
          }
          </div>
        </div>
        <div class='chat-area__tab-panels'>
          <div
            class='chat-area__tab-panel chat-area__tab-panel--chat'
            [class.chat-area__tab-panel--hidden]='activeMainTabId() !== "conversation"'
          >
            <app-chat-box
              class='chat-area__panel-host'
              [messages]='messages()'
              [conversationId]='activeConversationId()'
              [loading]='loading()'
              [processingToolsActive]='processingToolsActive()'
              [ttsLoading]='tts.ttsLoading()'
              [streamingParts]='streamingParts()'
              [streamingFinalText]='streamingFinalText()'
              [streamingPlanner]='streamingPlanner()'
              [fontSize]='fontSize()'
              (sendResponse)='onSendResponse($event)'
              (diffReviewFinished)='onDiffReviewFinished($event)'
              (stagedTransferBatchFinished)='onStagedTransferBatchFinished($event)'
              (acceptCommandFinished)='onAcceptCommandFinished($event)'
              (copyReviewFinished)='onCopyReviewFinished($event)'
              (deleteReviewFinished)='onDeleteReviewFinished($event)'
              (planConfirmFinished)='onPlanConfirmFinished($event)'
            />
          </div>
          <div
            class='chat-area__tab-panel chat-area__tab-panel--monaco'
            [class.chat-area__tab-panel--hidden]='!activeMainTabId().startsWith("file:") || activeFileIsImage()'
          >
            <app-workspace-monaco
              class='chat-area__panel-host'
              [workspacePath]='currentWorkspacePath()'
              [relativePath]='monacoActiveFileRelativePath()'
              [openFileRelativePaths]='monacoOpenFileRelativePaths()'
              [editorSettings]='appConfig()?.monacoWorkspaceEditor ?? null'
              [pendingDiffPayload]='pendingDiffForActiveEditor()'
              [pendingStagedTransferBatch]='pendingStagedTransferBatchForActiveEditor()'
              [conversationId]='activeConversationId()'
              [pendingEditorReveal]='monacoRevealPending()'
              (unsavedPathsChange)='onMonacoUnsavedPathsChange($event)'
              (diffReviewFinished)='onDiffReviewFinished($event)'
              (stagedTransferBatchFinished)='onStagedTransferBatchFinished($event)'
              (stagedTransferBatchFileResolved)='onStagedTransferBatchFileResolved($event)'
              (navigateWorkspaceFile)='onWorkspaceMonacoNavigate($event)'
              (pendingEditorRevealHandled)='onMonacoRevealHandled()'
            />
          </div>
          <div
            class='chat-area__tab-panel chat-area__tab-panel--image'
            [class.chat-area__tab-panel--hidden]='!activeFileIsImage()'
          >
            <app-image-viewer
              class='chat-area__panel-host'
              [workspacePath]='currentWorkspacePath()'
              [relativePath]='activeFileRelativePath()'
            />
          </div>
        </div>
        </div>
      </section>

      <section class='chat-area__dock'>
        <app-workspace-terminal-dock
          [workspacePath]='currentWorkspacePath()'
          [appConfig]='appConfig()'
        />
      </section>

      <section class='chat-area__composer'>
        <app-chat-context-bar
          [files]='chatContextFiles()'
          [workspaceRoot]='currentWorkspacePath()'
          (removeFile)='removeChatContextFile($event)'
          (pathsDropped)='onChatContextPathsDropped($event)'
        />
        <div class='chat-area__composer-input'>
        <app-talk-mode
          class='composer-talk composer-talk--hidden'
          [talkInputDeviceId]='appConfig()?.audioTranscription?.talkInputDeviceId ?? "default"'
          [talkSilenceThresholdSec]='appConfig()?.audioTranscription?.talkSilenceThresholdSeconds ?? 2'
          [(talkEnabled)]='talkEnabled'
          [(currentTranscript)]='talkStatus'
          [(statusMessage)]='talkModeDetailStatus'
          (promptCaptured)='onMessageSent($event)'
          (recordingBegan)='onTalkRecordingBegan()'
          (talkCaptureFinished)='onTalkCaptureFinished($event)'
        />
        <app-message-box
          [(composerMode)]='composerMode'
          [voiceActive]='talkEnabled() && speechEnabled()'
          (voiceToggle)='toggleVoice()'
          [talkStatus]='talkStatus()'
          [talkDetail]='talkModeDetailStatus()'
          [loading]='loading()'
          [contextBlocked]='contextChatBlocked()'
          [attachmentCount]='chatContextFiles().length'
          (messageSent)='onMessageSent($event)'
          (abortRequested)='onAbortRequested()'
        />
        </div>
      </section>

      <section class='chat-area__status'>
      <app-status-bar
        [appConfig]='appConfig()'
        [usedTokens]='contextCapacity().usedTokens'
        [maxTokens]='contextCapacity().maxTokens'
        [remainingTokens]='contextCapacity().remainingTokens'
        [usedPercentage]='contextCapacity().usedPercentage'
        [compressionNotice]='activeContextStatusNotice()'
        [modelName]='activeLlmModelDisplayName()'
        [modelPresetOptions]='llmModelPresetOptions()'
        [activeLlmModelId]='appConfig()?.activeLlmModelId ?? ""'
        (activeLlmModelChange)='onActiveLlmModelChange($event)'
        [(editorMode)]='editorMode'
        [(autoApplyMode)]='autoApplyMode'
      />
      </section>
    </div>

    <div class='sidebar-resize-handle' (mousedown)='onSidebarResizeStart($event)'></div>

    <div class='sidebar' [style.width.px]='sidebarWidth()'>
      <app-conversation-manager
        [conversations]='conversations()'
        [activeId]='activeConversationId()'
        [activeFileRelativePath]='activeFileRelativePath()'
        [pendingIds]='pendingIds()'
        (newConversation)='onNewConversation()'
        (selectConversation)='onSelectConversation($event)'
        (deleteConversation)='onDeleteConversation($event)'
        (renameConversation)='onRenameConversation($event)'
      />
    </div>
  </div>

  <div class='app-modal-scrim' aria-hidden='true'></div>
  <app-themed-confirm-dialog />
</div>
