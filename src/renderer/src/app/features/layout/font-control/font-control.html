<div class="font-control">
  <label class="font-size-label">Font Size</label>
  <button (click)="decrease()" title="Decrease text size">
    <lucide-icon name="minus" [size]="14" />
  </button>
  <span class="size-label" (dblclick)="reset()" title="Double-click to reset">
    {{ fontSize() | number:'1.1-1' }}
  </span>
  <button (click)="increase()" title="Increase text size">
    <lucide-icon name="plus" [size]="14" />
  </button>
</div>
