# Packaging: https://www.electron.build/configuration/configuration
appId: com.clara.coder
productName: Clara Coder
icon: build/icon.png

directories:
  output: release

# Auto-update feed. Embedded in the packaged app as resources/app-update.yml, which
# electron-updater reads. Releases are created by .github/workflows/release.yml with
# `gh release create`, not by electron-builder (`--publish never`), so the tag is pinned
# to the built commit. GitHub ignores channels: every release carries plain latest*.yml.
publish:
  provider: github
  owner: dpere122
  repo: ClaraCoder

# dist/ is gitignored; list it explicitly so it is still shipped.
files:
  - dist/**/*
  - package.json
  - build/icon.png
  - build/icon.ico

# node-pty ships Electron prebuilds; rebuilding needs a full VS toolchain (e.g. Spectre libs on Windows).
npmRebuild: false

extraResources:
  - from: python
    to: python
    filter:
      - "**/*"
      - "!**/.venv/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
  # Portable CPython from `npm run bundle:python` (python-build-standalone).
  - from: runtime-bundle/python
    to: runtime-python
    filter:
      - "**/*"
  # Pinned ripgrep from `npm run bundle:rg`; the sidecar gets its path as CLARA_RG_PATH.
  - from: runtime-bundle/ripgrep
    to: ripgrep
    filter:
      - "**/*"
  # Bundled vtsls (TypeScript/JavaScript LSP) from `npm run bundle:vtsls`.
  # Run via the Electron binary in Node mode (ELECTRON_RUN_AS_NODE=1); no system Node required.
  #
  # electron-builder's extraResources filter always drops a ROOT-level `node_modules`
  # of the `from` dir (app-builder-lib/util/filter.js), so `from: vtsls-bundle` shipped
  # only package.json. Copy node_modules as its own entry (it becomes the source root),
  # and the metadata files separately. scripts/verify-packed-runtime.mjs asserts the entry.
  - from: vtsls-bundle/node_modules
    to: vtsls/node_modules
    filter:
      - "**/*"
      - "!.bin/**"
      - "!.package-lock.json"
  - from: vtsls-bundle
    to: vtsls
    filter:
      - "package.json"
      - ".clara-vtsls-version"

asarUnpack:
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/better-sqlite3/**/*"
  # @huggingface/hub Xet path loads wasm/native helpers from these packages.
  - "**/node_modules/@huggingface/xetchunk-wasm/**/*"
  - "**/node_modules/@huggingface/blake3-jit/**/*"

# artifactName: no spaces. GitHub turns spaces in asset names into dots, so the file name
# latest.yml records would no longer match the uploaded asset.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Clara-Coder-${version}-Windows-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  artifactName: Clara-Coder-${version}-mac-${arch}.${ext}

linux:
  # .deb installs without FUSE. AppImage needs libfuse.so.2 (Debian/Ubuntu: libfuse2t64).
  target:
    - deb
    - AppImage
  category: Development
  # Multi-size hicolor PNGs (build/icons/NxN.png) so DEs render the launcher icon.
  icon: build/icons
  # Required by fpm for .deb (package.json author is empty).
  maintainer: Clara Coder <dev@clara.coder>
  syncDesktopName: true
  artifactName: Clara-Coder-${version}-Linux-${arch}.${ext}

# Package was renamed from nemo-wrapper → clara-coder; both ship
# /usr/share/applications/clara-coder.desktop and /opt/Clara Coder/.
deb:
  fpm:
    - --replaces
    - nemo-wrapper
    - --conflicts
    - nemo-wrapper
    - --provides
    - nemo-wrapper
