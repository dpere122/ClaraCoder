@if (kind() === 'hitl') {
  <div
    class="stream-trail-row hitl-trail-row"
    [class.stream-trail-row--pending]="hitlPending()"
    [class.stream-trail-row--complete]="hitlComplete()"
    [class.stream-trail-row--cancelled]="hitlCancelled()"
  >
    <span class="stream-trail-row__meta">{{ part().text }}</span>
    <span class="stream-trail-row__sep">&middot;</span>
    <span class="stream-trail-row__name" [attr.title]="part().label">{{ part().label }}</span>
  </div>
} @else {
  <div class="aux-stream-tool-part">
    <app-stream-tool-pill
      [name]="pillName()"
      [nameTitle]="pillNameTitle()"
      [meta]="pillMeta()"
      [duration]="pillDuration()"
      [durationTitle]="pillDurationTitle()"
      [durationSlow]="pillDurationSlow()"
      [state]="pillState()"
      [expandable]="expandable()"
      [expanded]="expanded()"
      [live]="live()"
      (toggle)="toggleExpanded()"
    />
    @if (showShellPreview()) {
      <app-delegated-shell-terminal
        class="aux-stream-tool-part__terminal"
        [label]="part().label || 'Tool output'"
        [text]="part().text"
        [runComplete]="live() ? !!part().runComplete : true"
        [exitCode]="part().exitCode ?? null"
        [outcome]="part().outcome"
        displayMode="preview"
      />
    }
    @if (expanded()) {
      @if (kind() === 'shell') {
        <app-delegated-shell-terminal
          class="aux-stream-tool-part__terminal"
          [label]="part().label || 'Tool output'"
          [text]="part().text"
          [runComplete]="live() ? !!part().runComplete : true"
          [exitCode]="part().exitCode ?? null"
          [outcome]="part().outcome"
          displayMode="full"
        />
      } @else if (editDiff()) {
        <app-tool-edit-diff class="aux-stream-tool-part__diff" [diff]="editDiff()" [result]="part().text" />
      } @else if (isReadToolRow()) {
        <app-ansi-terminal-pre
          class="aux-stream-tool-part__detail"
          preClass="output-pre terminal-output terminal-ansi"
          [text]="readExpandedText()"
        />
      } @else {
        <app-ansi-terminal-pre
          class="aux-stream-tool-part__detail"
          preClass="output-pre terminal-output terminal-ansi"
          [text]="part().text"
        />
      }
    }
  </div>
}
