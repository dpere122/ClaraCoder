<div class='health-shell' data-theme-group='health.window'>
  <header class='health-header' data-theme-group='health.header'>
    <div class='health-header__brand'>
      <h2>Health</h2>
      <button
        type='button'
        class='health-verdict'
        [attr.data-tone]='runtime.verdict().tone'
        [attr.title]='runtime.verdict().detail'
        (click)="selectTab('runtime')"
      >
        <span class='health-dot' aria-hidden='true'></span>
        <span class='health-verdict__title'>{{ runtime.verdict().title }}</span>
        @if (runtime.verdict().issues > 0) {
          <span class='health-verdict__detail'>{{ runtime.verdict().detail }}</span>
        }
      </button>
    </div>

    <div class='health-tabs' role='tablist' aria-label='Health views' (keydown)='onTabKeydown($event)'>
      @for (tab of tabs; track tab.id) {
        <button
          type='button'
          role='tab'
          class='health-tab'
          [attr.data-tab]='tab.id'
          [id]="'health-tab-' + tab.id"
          [attr.aria-selected]='activeTab() === tab.id'
          [attr.aria-controls]="'health-panel-' + tab.id"
          [attr.tabindex]='activeTab() === tab.id ? 0 : -1'
          [class.is-active]='activeTab() === tab.id'
          (click)='selectTab(tab.id)'
        >
          <lucide-icon [name]='tab.icon' [size]='14' aria-hidden='true'></lucide-icon>
          <span>{{ tab.label }}</span>
          @if (tab.id === 'runtime' && runtime.verdict().issues > 0) {
            <span class='health-tab__badge' [attr.data-tone]='runtime.verdict().tone'>{{ runtime.verdict().issues }}</span>
          }
        </button>
      }
    </div>

    <button type='button' class='health-btn' (click)='closeWindow()'>Close</button>
  </header>

  <!-- Console stays mounted (hidden) so log history, filters, and scroll survive tab switches. -->
  <section
    class='health-panel health-panel--console'
    id='health-panel-console'
    role='tabpanel'
    aria-labelledby='health-tab-console'
    data-theme-group='health.console'
    [hidden]="activeTab() !== 'console'"
  >
    <div class='health-strip'>
      @for (chip of runtime.chips(); track chip.key) {
        <button
          type='button'
          class='health-strip__chip'
          [attr.data-tone]='chip.tone'
          [attr.title]="chip.label + ': ' + chip.hint"
          (click)="selectTab('runtime')"
        >
          <span class='health-dot' aria-hidden='true'></span>{{ chip.label }}
        </button>
      }
      <span class='health-strip__divider' aria-hidden='true'></span>
      @if (metrics.enabled()) {
        @for (stat of stripStats(); track stat.key) {
          <button type='button' class='health-strip__stat' (click)="selectTab('system')">
            <span class='health-strip__stat-label'>{{ stat.label }}</span>{{ stat.value }}
          </button>
        }
      } @else {
        <button type='button' class='health-strip__stat health-strip__stat--off' (click)="selectTab('system')">
          Live stats off
        </button>
      }
    </div>
    <app-health-log-viewer />
  </section>

  @if (activeTab() === 'runtime') {
    <section class='health-panel' id='health-panel-runtime' role='tabpanel' aria-labelledby='health-tab-runtime'>
      <app-health-runtime-status />
    </section>
  }

  @if (activeTab() === 'system') {
    <section class='health-panel' id='health-panel-system' role='tabpanel' aria-labelledby='health-tab-system'>
      <app-health-system />
    </section>
  }
</div>
