<div class="status-bar">
  <app-context-capacity
    [appConfig]="appConfig()"
    [usedTokens]="usedTokens()"
    [maxTokens]="maxTokens()"
    [remainingTokens]="remainingTokens()"
    [usedPercentage]="usedPercentage()"
    [compressionNotice]="compressionNotice()"
    [(editorMode)]="editorMode"
    [(autoApplyMode)]="autoApplyMode"
  />
  @if (workspaceFileChange.visible()) {
    <span
      class="status-bar__workspace-file"
      [class.status-bar__workspace-file--fading]="workspaceFileChange.fading()"
      [attr.title]="workspaceFileChange.fileName()"
    >{{ workspaceFileChange.fileName() }}</span>
  }
</div>
