<div
  class="stream-trail-panel auxiliary-stream-panel"
  [class.stream-trail-panel--live]="live()"
  [class.stream-trail-panel--collapsed]="mode() === 'collapsed'"
  [class.stream-trail-panel--preview]="mode() === 'preview'"
  [class.stream-trail-panel--expanded]="mode() === 'expanded'"
>
  @if (!hideHeaderToggle()) {
    <button
      type="button"
      class="stream-trail-panel__toggle"
      (click)="toggleMode()"
      [attr.aria-expanded]="contentVisible()"
    >
      <span
        class="stream-trail-panel__title"
        [class.stream-trail-panel__title--custom]="hasCustomTitle()"
        [attr.title]="title()"
      >{{ title() }}</span>
      <span class="stream-trail-panel__chevron" aria-hidden="true">{{ isExpanded() ? '▼' : '▶' }}</span>
    </button>
  }
  @if (contentVisible()) {
    <div
      #viewport
      class="stream-trail-panel__viewport"
      [class.stream-trail-panel__viewport--peek]="mode() === 'preview'"
      [class.stream-trail-panel__viewport--full]="mode() === 'expanded'"
    >
      @for (part of parts(); track trackPartId(part, $index)) {
        @if (isReasoning(part.streamTag)) {
          <pre class="llm-reasoning-body auxiliary-stream-panel__reasoning">{{ part.text }}</pre>
        } @else {
          <app-aux-stream-tool-part
            [part]="part"
            [live]="live()"
            [compactDetails]="planPanelVisible()"
          />
        }
      }
    </div>
  }
  <!-- Trailing file-change entries (HITL trail) projected into the consolidated details stream.
       Rendered outside the collapsible viewport so pending reviews stay reachable. -->
  <ng-content />
</div>
