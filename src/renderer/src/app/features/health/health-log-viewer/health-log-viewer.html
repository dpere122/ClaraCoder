<div class='health-log'>
  <div class='health-log__toolbar'>
    <div class='health-log__toolbar-left'>
      <label class='health-log__label'>
        Verbosity
        <app-pill-select
          class='health-log__select'
          [value]='logVerbosity()'
          (valueChange)='onVerbosityChange($any($event))'
          ariaLabel='Verbosity'
          [options]="[
            { id: 'debug', label: 'Debug' },
            { id: 'info', label: 'Info' },
            { id: 'warning', label: 'Warning' },
            { id: 'error', label: 'Error' }
          ]"
        />
      </label>
      <label class='health-log__label'>
        Show in list
        <app-pill-select
          class='health-log__select'
          [value]='logLevelFilter()'
          (valueChange)='logLevelFilter.set($any($event))'
          ariaLabel='Show in list'
          [options]="[
            { id: 'ALL', label: 'All levels' },
            { id: 'INFO', label: 'Info and above' },
            { id: 'WARNING', label: 'Warnings and errors' },
            { id: 'ERROR', label: 'Errors only' }
          ]"
        />
      </label>
      <label class='health-log__label'>
        Message format
        <app-pill-select
          class='health-log__select health-log__select--wide'
          [value]='messageFormat()'
          (valueChange)='messageFormat.set($any($event))'
          ariaLabel='Message format'
          [options]="[
            { id: 'raw', label: 'Plain text' },
            { id: 'json', label: 'Pretty JSON (embedded)' },
            { id: 'xml', label: 'Pretty XML' }
          ]"
        />
      </label>
    </div>
    <span class='health-log__toolbar-divider' aria-hidden='true'></span>
    <input
      type='search'
      class='health-log__search'
      placeholder='Search logs (message, logger, source)…'
      [ngModel]='searchQuery()'
      (ngModelChange)='searchQuery.set($event)'
    />
    <span class='health-log__toolbar-divider' aria-hidden='true'></span>
    <div class='health-log__toolbar-right'>
      <button type='button' class='health-log__btn health-log__btn--primary' (click)='onLogExpandClick()'>
        {{ logExpanded() ? 'Show charts' : 'Expand log' }}
      </button>
      <button type='button' class='health-log__btn' (click)='onAutoScrollToggle()'>
        {{ autoScroll() ? 'Auto-scroll on' : 'Auto-scroll off' }}
      </button>
    </div>
  </div>
  <div class='health-log__headrow' aria-hidden='true'>
    <span>Time</span>
    <span>Level</span>
    <span>Source</span>
    <span>Logger</span>
    <span>Message</span>
  </div>
  <div class='health-log__viewport' #logViewport (scroll)='onLogScroll()'>
    <div class='health-log__virtual-spacer' [style.height.px]='virtualWindow().topSpacer' aria-hidden='true'></div>
    @for (slot of virtualWindow().slots; track slot.index) {
      <div class='health-log__row-mount' [attr.data-health-log-row]='slot.index'>
        <div class='health-log__row' [attr.data-level]='slot.row.level'>
          <span class='health-log__ts'>{{ formatTs(slot.row.ts) }}</span>
          <span class='health-log__lvl'>{{ slot.row.level }}</span>
          <span class='health-log__src'>{{ slot.row.source }}</span>
          <span class='health-log__logger'>{{ slot.row.logger }}</span>
          <span
            class='health-log__msg'
            [class.health-log__msg--formatted]="messageFormat() !== 'raw'"
            >{{ slot.row.message | healthLogMessage: messageFormat() }}</span>
        </div>
      </div>
    }
    <div class='health-log__virtual-spacer' [style.height.px]='virtualWindow().bottomSpacer' aria-hidden='true'></div>
  </div>
</div>
