<div class='app-layout' [class.app-layout--dimmed]='settingsWindowOpen()'>
  <div class='app-top-bar px-4 pt-3'>
    @if (electron.isElectron) {
      <div class='window-chrome'>
        <button type='button' class='chrome-menu-btn' (click)='onChromeFileMenu($event)'>File</button>
        <button type='button' class='chrome-menu-btn' (click)='onChromeHelpMenu($event)'>Help</button>
        <h1 class='title-glow chrome-title' (dblclick)='onWindowToggleMaximize()'>&gt; Clara AI_</h1>
        <button type='button' class='chrome-win-btn' (click)='onWindowMinimize()' aria-label='Minimize'>&#8722;</button>
        <button type='button' class='chrome-win-btn' (click)='onWindowToggleMaximize()' [attr.aria-label]='windowMaximized() ? "Restore" : "Maximize"'>
          {{ windowMaximized() ? '⧉' : '▢' }}
        </button>
        <button type='button' class='chrome-win-btn chrome-win-close' (click)='onWindowClose()' aria-label='Close'>×</button>
      </div>
    } @else {
      <h1 class='title-glow title-glow--solo'>&gt; Clara AI_</h1>
    }
    <app-tools-bar
      class='tools-bar-host'
      [(fontSize)]='fontSize'
      [(speechEnabled)]='speechEnabled'
      [(selectedVoice)]='selectedVoice'
      [(talkEnabled)]='talkEnabled'
      [(currentTranscript)]='talkStatus'
      [(editorMode)]='editorMode'
      [(autoApplyMode)]='autoApplyMode'
      [(pinned)]='pinned'
      [activeConversationId]='activeConversationId()'
      (promptCaptured)='onMessageSent($event)'
      (recordingBegan)='onTalkRecordingBegan()'
      (talkCaptureFinished)='onTalkCaptureFinished($event)'
    />
  </div>

  <div class='app-content'>
    <div class='workspace-panel' [style.width.px]='workspaceWidth()'>
      <app-workspace
        [workspaces]='workspaces()'
        [currentWorkspaceId]='currentWorkspaceId()'
        (workspaceChanged)='onWorkspaceChanged($event)'
        (addWorkspace)='onAddWorkspace()'
      />
    </div>

    <div class='workspace-resize-handle' (mousedown)='onWorkspaceResizeStart($event)'></div>

    <div class='chat-area d-flex flex-column overflow-hidden py-3 px-4'>
      <app-chat-box
        class='chat-box-host flex-grow-1 overflow-hidden mb-1'
        [messages]='messages()'
        [conversationId]='activeConversationId()'
        [loading]='loading()'
        [processingToolsActive]='processingToolsActive()'
        [ttsLoading]='tts.ttsLoading()'
        [streamingParts]='streamingParts()'
        [livePlannerProgress]='livePlannerProgress()'
        [fontSize]='fontSize()'
        (sendResponse)='onSendResponse($event)'
        (diffReviewFinished)='onDiffReviewFinished($event)'
        (acceptCommandFinished)='onAcceptCommandFinished($event)'
        (copyReviewFinished)='onCopyReviewFinished($event)'
        (deleteReviewFinished)='onDeleteReviewFinished($event)'
      />

      <app-workspace-terminal-dock
        class='workspace-terminal-dock-host'
        [workspacePath]='currentWorkspacePath()'
        [appConfig]='appConfig()'
      />

      <app-message-box
        class='message-box-host'
        [talkStatus]='talkStatus()'
        [loading]='loading()'
        (messageSent)='onMessageSent($event)'
        (abortRequested)='onAbortRequested()'
      />

      <app-status-bar
        class='status-bar-host'
        [usedTokens]='contextCapacity().usedTokens'
        [maxTokens]='contextCapacity().maxTokens'
        [remainingTokens]='contextCapacity().remainingTokens'
        [usedPercentage]='contextCapacity().usedPercentage'
        [modelName]='activeLlmConnection()?.model || "No active model"'
        [modelPresetOptions]='llmModelPresetOptions()'
        [activeLlmModelId]='appConfig()?.activeLlmModelId ?? ""'
        (activeLlmModelChange)='onActiveLlmModelChange($event)'
      />
    </div>

    <div class='sidebar-resize-handle' (mousedown)='onSidebarResizeStart($event)'></div>

    <div class='sidebar' [style.width.px]='sidebarWidth()'>
      <app-conversation-manager
        [conversations]='conversations()'
        [activeId]='activeConversationId()'
        [pendingIds]='pendingIds()'
        (newConversation)='onNewConversation()'
        (selectConversation)='onSelectConversation($event)'
        (deleteConversation)='onDeleteConversation($event)'
        (renameConversation)='onRenameConversation($event)'
      />
      <app-llama-server-tile [appConfig]='appConfig()' [llmStreamActive]='loading()' />
    </div>
  </div>

  <div class='app-modal-scrim' aria-hidden='true'></div>
</div>
