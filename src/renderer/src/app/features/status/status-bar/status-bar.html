<div class="status-bar">
  @if (compressionNotice()) {
    <p class="status-bar__compression-notice">{{ compressionNotice() }}</p>
  }
  @if (workspaceFileChange.visible()) {
    <span
      class="status-bar__workspace-file"
      [class.status-bar__workspace-file--fading]="workspaceFileChange.fading()"
      [attr.title]="workspaceFileChange.fileName()"
    >{{ workspaceFileChange.fileName() }}</span>
  }
</div>
