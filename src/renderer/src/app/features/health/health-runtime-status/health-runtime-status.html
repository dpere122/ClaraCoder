<div class='runtime' data-theme-group='health.runtime'>
  <section class='health-card runtime-banner' [attr.data-tone]='runtime.verdict().tone' aria-live='polite'>
    <span class='health-dot runtime-banner__dot' aria-hidden='true'></span>
    <div class='runtime-banner__copy'>
      <h3>{{ runtime.verdict().title }}</h3>
      <p>{{ runtime.verdict().detail }}</p>
    </div>
    <button type='button' class='health-btn' (click)='openDependencies()'>Open Dependencies</button>
  </section>

  <div class='runtime-grid' [class.runtime-grid--stale]='runtime.stale()'>
    @for (chip of runtime.chips(); track chip.key) {
      <article class='health-card runtime-tile' [attr.data-tone]='chip.tone' [attr.title]='chip.hint'>
        <div class='runtime-tile__head'>
          <span class='health-dot' aria-hidden='true'></span>
          <span class='runtime-tile__label'>{{ chip.label }}</span>
        </div>
        <span class='runtime-tile__detail'>{{ chip.detail }}</span>
      </article>
    }
  </div>

  <p class='runtime-note'>
    Refreshes every few seconds. Lifecycle events log under <code>clara.electron.deps</code> and
    <code>clara.runtime.deps.*</code> in the Console tab.
  </p>
</div>
