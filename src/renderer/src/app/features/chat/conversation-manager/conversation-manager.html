<div class="conv-manager">
  <div class="conv-list">
    @for (conv of conversations(); track conv.id) {
      <div
        class="conv-item"
        [class.active]="conv.id === activeId()"
        (click)="selectConversation.emit(conv.id)"
        (contextmenu)="onConvContextMenu($event, conv)"
      >
        @if (editingId() === conv.id) {
          <input
            class="rename-input"
            [ngModel]="editTitle()"
            (ngModelChange)="editTitle.set($event)"
            (keydown.enter)="confirmRename(conv.id)"
            (keydown.escape)="cancelRename()"
            (blur)="cancelRename()"
            (click)="$event.stopPropagation()"
            autofocus
          />
        } @else {
          @if (pendingIds().has(conv.id)) {
            <span class="conv-pending-spinner-host" aria-hidden="true">
              <ngx-spinner
                [name]="convPendingSpinnerName(conv.id)"
                type="ball-atom"
                [fullScreen]="false"
                bdColor="rgba(0,0,0,0)"
                size="small"
                color="var(--bs-secondary-color)"
              ></ngx-spinner>
            </span>
          }
          <span class="conv-title">{{ conv.title }}</span>
          <button class="delete-btn" (click)="onDelete(conv.id, $event)" title="Delete conversation">
            <lucide-icon name="trash" [size]="14" />
          </button>
        }
      </div>
    } @empty {
      <p class="empty-hint">No conversations yet.</p>
    }
  </div>

  @if (electron.isElectron) {
    <div class="conv-lsp-footer">
      <app-editor-lsp-status
        [conversationId]="activeId()"
        [activeFileRelativePath]="activeFileRelativePath()"
      />
    </div>
  }

  @if (contextMenuVisible()) {
    <div
      class="conv-context-menu"
      role="menu"
      [style.left.px]="contextMenuX()"
      [style.top.px]="contextMenuY()"
    >
      <button
        type="button"
        class="conv-context-menu-item"
        role="menuitem"
        (mousedown)="onContextMenuItemMousedown($event); onContextMenuRename()"
      >
        Rename…
      </button>
      <button
        type="button"
        class="conv-context-menu-item danger"
        role="menuitem"
        (mousedown)="onContextMenuItemMousedown($event); onContextMenuDelete()"
      >
        Delete…
      </button>
    </div>
  }
</div>
