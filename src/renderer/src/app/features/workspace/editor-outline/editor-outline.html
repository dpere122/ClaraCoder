<div class="editor-outline" data-theme-group="editor.outline">
  <div class="editor-outline__toolbar">
    <button
      type="button"
      class="editor-outline__toolbar-btn"
      [class.editor-outline__toolbar-btn--active]="allExpanded()"
      [attr.aria-pressed]="allExpanded()"
      [title]="allExpanded() ? 'Collapse all symbols' : 'Expand all symbols'"
      [disabled]="!symbols().length"
      (click)="toggleExpandAll()"
    >
      {{ allExpanded() ? 'Collapse all' : 'Expand all' }}
    </button>
  </div>
  <div class="editor-outline__scroll" role="tree">
    @for (sym of symbols(); track trackKey(sym)) {
      <app-editor-outline-node
        [symbol]="sym"
        [depth]="0"
        [bulkExpansion]="bulkExpansion()"
        (revealSymbol)="onSymbolClick($event)"
      />
    } @empty {
      <div class="editor-outline__empty">No symbols</div>
    }
  </div>
</div>
