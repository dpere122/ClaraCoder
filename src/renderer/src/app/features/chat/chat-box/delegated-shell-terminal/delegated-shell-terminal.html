<div
  class="delegated-shell-terminal-wrap code-block-output"
  [class.delegated-shell-terminal-wrap--preview]="displayMode() === 'preview'"
  [class.delegated-shell-terminal-wrap--full]="displayMode() === 'full'"
>
  <div
    class="terminal-shell"
    [class.terminal-shell-running]="!runComplete()"
  >
    @if (displayMode() === 'full') {
      <div class="terminal-shell-header">
        <div class="terminal-shell-title-row">
          <span class="terminal-shell-title">Terminal</span>
          <span [class]="badgeClass()">{{ badgeText() }}</span>
        </div>
      </div>
    }
    <div class="terminal-shell-body" #terminalBody>
      @if (text().length === 0) {
        <div class="terminal-placeholder">Waiting for terminal output...</div>
      } @else {
        <app-ansi-terminal-pre [text]="renderText()" />
      }
    </div>
  </div>
</div>
