<div class="status-bar">
  <app-context-capacity
    [usedTokens]="usedTokens()"
    [maxTokens]="maxTokens()"
    [remainingTokens]="remainingTokens()"
    [modelName]="modelName()"
    [modelPresetOptions]="modelPresetOptions()"
    [activeLlmModelId]="activeLlmModelId()"
    (activeLlmModelChange)="activeLlmModelChange.emit($event)"
    [usedPercentage]="usedPercentage()"
    [(editorMode)]="editorMode"
    [(autoApplyMode)]="autoApplyMode"
  />
</div>
