@if (talkStatus()) {
  <div class="talk-status">
    <span class="talk-status-dot"></span>
    <span class="talk-status-text">{{ talkStatus() }}</span>
  </div>
}
<div class="input-group">
  <input
    type="text"
    class="form-control"
    placeholder="> Enter command..."
    [ngModel]="userInput()"
    (ngModelChange)="userInput.set($event)"
    (keydown.enter)="send()"
  />
  @if (loading()) {
    <button class="btn btn-abort" type="button" (click)="abort()" title="Stop generation">
      <lucide-icon name="square" [size]="16" class="stop-icon"></lucide-icon>
    </button>
  } @else {
    <button class="btn" type="button" (click)="send()">
      SEND >>
    </button>
  }
</div>
