<div
  class="context-capacity"
  [class.context-capacity--compact]="compact()"
  [class.context-capacity--healthy]="progressClass() === 'context-capacity--healthy'"
  [class.context-capacity--warn]="progressClass() === 'context-capacity--warn'"
  [class.context-capacity--danger]="progressClass() === 'context-capacity--danger'"
>
  <button
    type="button"
    class="context-capacity__circle-button"
    [attr.aria-label]="metricsTooltip()"
    [attr.title]="metricsTooltip()"
  >
    <span class="context-capacity__tooltip" role="tooltip">{{ metricsTooltip() }}</span>
    <svg class="context-capacity__circle" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="context-capacity__track" cx="20" cy="20" r="16"></circle>
      <circle
        class="context-capacity__fill"
        cx="20"
        cy="20"
        r="16"
        [attr.stroke-dasharray]="circleCircumference"
        [attr.stroke-dashoffset]="dashOffset()"
      ></circle>
    </svg>
    <span class="context-capacity__circle-label">{{ usedPercentage() }}</span>
  </button>

  @if (compressionNotice() && !compact()) {
    <p class="context-capacity__compression-notice">{{ compressionNotice() }}</p>
  }
</div>
