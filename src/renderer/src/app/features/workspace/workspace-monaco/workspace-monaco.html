<div class="workspace-monaco-host">
  @if (detachedBanner()) {
    <div class="workspace-monaco-detached alert alert-warning py-2 px-3 mb-0 rounded-0 border-start-0 border-end-0 border-top-0 small" role="status">
      {{ detachedBanner() }}
    </div>
  }
  @if (loadError()) {
    <div class="workspace-monaco-error" role="alert">{{ loadError() }}</div>
  }
  @if (readOnlyDiff(); as diff) {
    @if (monacoDiffActive()) {
      <div class="workspace-monaco-diff-toolbar border-bottom px-2 py-2 d-flex flex-wrap align-items-center gap-2">
        <span class="small text-secondary me-1">{{ diff.label }}</span>
        <code class="small">{{ diff.relativePath }}</code>
        <span class="badge text-bg-secondary">Read-only</span>
        <span class="small text-secondary">Before this turn → after this turn</span>
      </div>
    }
  }
  <div class="workspace-monaco-body">
    <div class="workspace-monaco-editor-stack" data-theme-group="editor.monaco">
      @if (showMdToolbar()) {
        <!-- Floating Edit | Preview pill; overlays the top-right of the editor / preview pane. -->
        <div class="workspace-monaco-md-toggle" role="group" aria-label="Markdown view mode">
          <button
            type="button"
            class="workspace-monaco-md-toggle__btn"
            [class.is-active]="!mdPreviewActive()"
            [attr.aria-pressed]="!mdPreviewActive()"
            title="Edit markdown source"
            (click)="setMdViewMode('edit')"
          >
            Edit
          </button>
          <button
            type="button"
            class="workspace-monaco-md-toggle__btn"
            [class.is-active]="mdPreviewActive()"
            [attr.aria-pressed]="mdPreviewActive()"
            title="Rendered preview"
            (click)="setMdViewMode('preview')"
          >
            Preview
          </button>
        </div>
      }
      <div
        #editorHost
        class="workspace-monaco-editor workspace-monaco-pane"
        [class.workspace-monaco-pane--hidden]="monacoDiffActive() || mdPreviewActive()"
        aria-label="Workspace file editor"
      ></div>
      <div
        #previewHost
        class="workspace-monaco-md-preview workspace-monaco-pane"
        [class.workspace-monaco-pane--hidden]="!mdPreviewActive() || monacoDiffActive()"
        [innerHTML]="mdPreviewHtml()"
        tabindex="0"
        aria-label="Markdown preview"
      ></div>
      <div
        #diffHost
        class="workspace-monaco-diff workspace-monaco-pane"
        [class.workspace-monaco-pane--hidden]="!monacoDiffActive()"
        aria-label="Turn edit diff"
      ></div>
    </div>
  </div>
</div>
