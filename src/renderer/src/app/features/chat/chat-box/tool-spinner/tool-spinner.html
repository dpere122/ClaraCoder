<svg class="tool-spinner" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  @switch (kind()) {
    @case ('think') {
      <!-- Sierpinski triangle turning; its inner triangle pulses. -->
      <g class="ts-turn">
        <path class="ts-line" d="M16 4l12 21H4z" stroke-width="1.8" />
        <path class="ts-hi ts-pulse" d="M22 14.5L16 25l-6-10.5z" stroke-width="1.8" />
      </g>
    }
    @case ('prefill') {
      <!-- Cantor set: each level splits the one above into thirds. -->
      <path class="ts-line ts-level" d="M4 8h24" stroke-width="3" />
      <path class="ts-line ts-level ts-d1" d="M4 15h8M20 15h8" stroke-width="3" />
      <path class="ts-hi ts-level ts-d2" d="M4 22h2.67M9.33 22h2.67M20 22h2.67M25.33 22h2.67" stroke-width="3" />
    }
    @case ('read') {
      <!-- Nested squares lighting from the outside in. -->
      <path class="ts-line ts-wave" d="M6 6h20v20H6z" stroke-width="1.8" />
      <path class="ts-third ts-wave ts-d1" d="M16 6l10 10-10 10L6 16z" stroke-width="1.8" />
      <path class="ts-hi ts-wave ts-d2" d="M11 11h10v10H11z" stroke-width="1.8" />
    }
    @case ('run') {
      <!-- Hex core: two hexagons spinning against each other. -->
      <path class="ts-line ts-cw" d="M26 16l-5 8.66H11L6 16l5-8.66h10z" stroke-width="1.8" />
      <path class="ts-third ts-ccw" d="M22.5 16l-3.25 5.63h-6.5L9.5 16l3.25-5.63h6.5z" stroke-width="1.8" />
      <circle class="ts-dot" cx="16" cy="16" r="1.6" />
    }
    @case ('web') {
      <!-- A signal branching out to the nodes. -->
      <path class="ts-line" d="M16 16h6M16 16l3 5.2M16 16l-3 5.2M16 16h-6M16 16l-3-5.2M16 16l3-5.2" stroke-width="1.8" />
      <circle class="ts-dot ts-node" cx="22" cy="16" r="1.6" />
      <circle class="ts-dot ts-node" cx="19" cy="21.2" r="1.6" />
      <circle class="ts-dot ts-node" cx="13" cy="21.2" r="1.6" />
      <circle class="ts-dot ts-node" cx="10" cy="16" r="1.6" />
      <circle class="ts-dot ts-node" cx="13" cy="10.8" r="1.6" />
      <circle class="ts-dot ts-node" cx="19" cy="10.8" r="1.6" />
    }
    @default {
      <!-- write: a fractal tree growing level by level. -->
      <path class="ts-line ts-grow" d="M16 28v-8" stroke-width="2.4" />
      <path class="ts-line ts-grow ts-d1" d="M16 20l-5-5M16 20l5-5" stroke-width="2" />
      <path class="ts-third ts-grow ts-d2" d="M11 15l-3-4M11 15l2-4.5M21 15l-2-4.5M21 15l3-4" stroke-width="1.8" />
      <g class="ts-grow ts-d3">
        <circle class="ts-dot" cx="8" cy="11" r="1.4" />
        <circle class="ts-dot" cx="13" cy="10.5" r="1.4" />
        <circle class="ts-dot" cx="19" cy="10.5" r="1.4" />
        <circle class="ts-dot" cx="24" cy="11" r="1.4" />
      </g>
    }
  }
</svg>
