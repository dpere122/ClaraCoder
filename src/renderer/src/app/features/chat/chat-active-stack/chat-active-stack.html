<div
  class="chat-active-stack"
  [class.chat-active-stack--drag]="dragActive()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  @if (dragActive()) {
    <div class="chat-active-stack__drop-overlay" aria-hidden="true">
      <span class="chat-active-stack__drop-label">Drop files or folders to attach to chat</span>
    </div>
  }

  @if (showBrandEtch()) {
    <div
      class="chat-active-stack__etch"
      aria-hidden="true"
      style="--empty-etch-icon: url('app-icon-etch.png')"
    >
      <span class="chat-active-stack__etch-layer chat-active-stack__etch-layer--shadow"></span>
      <span class="chat-active-stack__etch-layer chat-active-stack__etch-layer--fill"></span>
      <span class="chat-active-stack__etch-layer chat-active-stack__etch-layer--highlight"></span>
    </div>
  }

  <app-chat-box
    class="chat-active-stack__transcript"
    [layout]="layout()"
    [messages]="messages()"
    [conversationId]="conversationId()"
    [loading]="loading()"
    [processingToolsActive]="processingToolsActive()"
    [ttsLoading]="ttsLoading()"
    [streamingParts]="streamingParts()"
    [streamingFinalText]="streamingFinalText()"
    [streamingPlanner]="streamingPlanner()"
    [fontSize]="fontSize()"
    [bottomInsetElement]="hitlDock"
    (restoreConversation)="restoreConversation.emit($event)"
    (sendResponse)="sendResponse.emit($event)"
    (openTurnDiff)="openTurnDiff.emit($event)"
    (planConfirmFinished)="planConfirmFinished.emit($event)"
    (agentQuestionFinished)="agentQuestionFinished.emit($event)"
  />

  <section class="chat-active-stack__composer" #composer [style.transform]="composerTransform()">
    <!-- Wrapper is the transcript's `bottomInsetElement`: its height eats the chat's buffer zone. -->
    <div class="chat-active-stack__hitl-dock" #hitlDock>
      <app-hitl-composer-dock
        [artifacts]="pendingHitlDockArtifacts()"
        [conversationId]="conversationId()"
        (deleteReviewFinished)="deleteReviewFinished.emit($event)"
        (acceptCommandFinished)="acceptCommandFinished.emit($event)"
        (planConfirmFinished)="planConfirmFinished.emit($event)"
        (agentQuestionFinished)="agentQuestionFinished.emit($event)"
        (themeProposalFinished)="themeProposalFinished.emit($event)"
      />
    </div>
    <div class="chat-active-stack__composer-input">
      <app-talk-mode
        class="composer-talk composer-talk--hidden"
        [talkInputDeviceId]="talkInputDeviceId()"
        [talkSilenceThresholdSec]="talkSilenceThresholdSec()"
        [(talkEnabled)]="talkEnabled"
        [(currentTranscript)]="talkStatus"
        [(statusMessage)]="talkModeDetailStatus"
        (promptCaptured)="promptCaptured.emit($event)"
        (recordingBegan)="talkRecordingBegan.emit()"
        (talkCaptureFinished)="talkCaptureFinished.emit($event)"
      />
      <app-message-box
        [(composerMode)]="composerMode"
        [(composerDraft)]="composerDraft"
        [(autoApplyMode)]="autoApplyMode"
        [(adminElevationGranted)]="adminElevationGranted"
        [adminElevationPending]="adminElevationPending()"
        (adminGrantRequested)="adminGrantRequested.emit()"
        [appConfig]="appConfig()"
        [usedTokens]="usedTokens()"
        [maxTokens]="maxTokens()"
        [remainingTokens]="remainingTokens()"
        [usedPercentage]="usedPercentage()"
        [voiceActive]="voiceActive()"
        (voiceToggle)="voiceToggle.emit()"
        [talkStatus]="talkStatus()"
        [talkDetail]="talkModeDetailStatus()"
        [loading]="loading()"
        [contextBlocked]="contextBlocked()"
        [attachmentCount]="attachmentCount() || chatContextFiles().length"
        [contextFiles]="chatContextFiles()"
        [workspaceRoot]="workspaceRoot()"
        (removeContextFile)="removeChatContextFile.emit($event)"
        (togglePinContextFile)="togglePinChatContextFile.emit($event)"
        (contextPathsDropped)="chatContextPathsDropped.emit($event)"
        (messageSent)="messageSent.emit($event)"
        (abortRequested)="abortRequested.emit()"
        (reasoningEffortChange)="reasoningEffortChange.emit($event)"
      />
    </div>
  </section>
</div>
