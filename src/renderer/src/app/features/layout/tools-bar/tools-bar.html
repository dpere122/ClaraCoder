<div class="tools-bar-row">
  <div class="tools-bar">
    <div class="tools-group">
      <app-font-control [(fontSize)]="fontSize" />
    </div>

    <span class="tools-divider"></span>

    <div class="tools-group">
      <app-speech-module [(speechEnabled)]="speechEnabled" [(selectedVoice)]="selectedVoice" />
    </div>

    <span class="tools-divider"></span>

    <div class="tools-group">
      <app-talk-mode
        [(talkEnabled)]="talkEnabled"
        [(currentTranscript)]="currentTranscript"
        (promptCaptured)="promptCaptured.emit($event)"
        (recordingBegan)="recordingBegan.emit()"
        (talkCaptureFinished)="talkCaptureFinished.emit($event)"
      />
    </div>

    <span class="tools-divider"></span>

    <div class="tools-group">
      <app-theme-selector />
    </div>

    <span class="tools-divider"></span>

    <div class="tools-group">
      <label class="pin-label">Pin</label>
      <button
        class="pin-toggle"
        [class.active]="pinned()"
        (click)="togglePin()"
        [attr.aria-pressed]="pinned()"
        title="Pin window on top"
      >
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </button>
    </div>
  </div>
</div>
