<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="spinnerTitle">
  <title id="spinnerTitle">Thinking</title>
  <style>
    /* One turn of the unit circle = one period of the wave; both run on the same 3s clock. */
    .arm {
      transform-origin: 20px 32px;
      animation: turn 3s linear infinite;
    }
    .wave {
      animation: scroll 3s linear infinite;
    }
    /* sin(θ) traced with ease-out / ease-in sine curves between the zero crossings and the peaks. */
    .proj {
      animation: sine 3s infinite;
    }
    .tick {
      animation: tick 1.5s ease-in-out infinite;
    }

    @keyframes turn {
      to { transform: rotate(-360deg); }
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(24px); }
    }
    @keyframes sine {
      0% { transform: translateY(0); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); }
      25% { transform: translateY(-10px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); }
      50% { transform: translateY(0); animation-timing-function: cubic-bezier(0.61, 1, 0.88, 1); }
      75% { transform: translateY(10px); animation-timing-function: cubic-bezier(0.12, 0, 0.39, 0); }
      100% { transform: translateY(0); }
    }
    @keyframes tick {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .arm, .wave, .proj, .tick { animation: none; }
      .arm { transform: rotate(-60deg); }
      .proj { transform: translateY(-8.66px); }
    }
  </style>

  <defs>
    <linearGradient id="ccFade" x1="34" y1="0" x2="58" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
    <mask id="ccGraph" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="34" y="18" width="24" height="28" fill="url(#ccFade)"/>
    </mask>
    <filter id="ccGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Axes and the unit circle. -->
  <path d="M34 19v26M34 32h24" stroke="#a8b89a" stroke-opacity="0.3" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M8 32h24M20 20v24" stroke="#a8b89a" stroke-opacity="0.14" stroke-width="1.1" stroke-linecap="round"/>
  <circle cx="20" cy="32" r="10" stroke="#a8b89a" stroke-opacity="0.55" stroke-width="1.7"/>
  <path class="tick" d="M46 30.5v3M58 30.5v3" stroke="#a8b89a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- sin θ, emerging at the axis and flowing right. -->
  <g mask="url(#ccGraph)">
    <g class="wave">
      <path
        d="M10 32.00 L11 34.59 L12 37.00 L13 39.07 L14 40.66 L15 41.66 L16 42.00 L17 41.66 L18 40.66 L19 39.07 L20 37.00 L21 34.59 L22 32.00 L23 29.41 L24 27.00 L25 24.93 L26 23.34 L27 22.34 L28 22.00 L29 22.34 L30 23.34 L31 24.93 L32 27.00 L33 29.41 L34 32.00 L35 34.59 L36 37.00 L37 39.07 L38 40.66 L39 41.66 L40 42.00 L41 41.66 L42 40.66 L43 39.07 L44 37.00 L45 34.59 L46 32.00 L47 29.41 L48 27.00 L49 24.93 L50 23.34 L51 22.34 L52 22.00 L53 22.34 L54 23.34 L55 24.93 L56 27.00 L57 29.41 L58 32.00"
        stroke="#c9a96e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- Projection: the radius tip carried across to the graph. -->
  <g class="proj">
    <path d="M20 32h14" stroke="#d8c8a0" stroke-opacity="0.45" stroke-width="1.1" stroke-dasharray="1.6 2"/>
    <circle cx="34" cy="32" r="2.1" fill="#c9a96e" filter="url(#ccGlow)"/>
  </g>

  <!-- Rotating radius. -->
  <g class="arm">
    <path d="M20 32h10" stroke="#7eb5a6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="32" r="2.2" fill="#7eb5a6" filter="url(#ccGlow)"/>
  </g>
  <circle cx="20" cy="32" r="1.5" fill="#d8c8a0"/>
</svg>
