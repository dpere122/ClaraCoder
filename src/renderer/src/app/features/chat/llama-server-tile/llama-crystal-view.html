<div
  class="llama-crystal-host"
  #host
  role="img"
  [attr.aria-label]="fractalName"
  [class.llama-crystal-host--shake]="shakeHost()"
>
  @if (loadError()) {
    <div class="llama-crystal-fallback" [attr.data-state]="aggregate()"></div>
  }
  <canvas #cv class="llama-crystal-canvas" [class.llama-crystal-canvas--hidden]="loadError()"></canvas>
</div>
