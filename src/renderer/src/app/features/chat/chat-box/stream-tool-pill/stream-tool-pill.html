<button
  type="button"
  class="stream-tool-pill"
  data-theme-group="chat.stream-pills"
  [class.stream-tool-pill--running]="state() === 'running'"
  [class.stream-tool-pill--complete]="state() === 'complete'"
  [class.stream-tool-pill--error]="state() === 'error'"
  [class.stream-tool-pill--expandable]="expandable()"
  [class.stream-tool-pill--expanded]="expanded()"
  [class.stream-tool-pill--live]="live()"
  [attr.aria-expanded]="expandable() ? expanded() : null"
  [disabled]="!expandable()"
  (click)="onClick()"
>
  @if (spinner()) {
    <span
      class="stream-tool-pill__spinner"
      [class]="'stream-tool-pill__spinner--' + spinnerKind()"
      aria-hidden="true"
    >
      <img
        class="stream-tool-pill__spinner-img"
        [src]="spinnerSrc()"
        alt=""
      />
    </span>
  }
  @if (shimmer()) {
    <!-- Letters reuse `.processing-text__letter` (chat-box.css): the thinking preview header's glow. -->
    <span
      class="stream-tool-pill__name stream-tool-pill__name--shimmer"
      [attr.title]="nameTitle() || name()"
      [attr.aria-label]="name()"
    >
      @for (ch of nameChars(); track $index) {
        <span class="processing-text__letter" [style.animation-delay]="($index * 0.08) + 's'" aria-hidden="true">{{ ch }}</span>
      }
    </span>
  } @else {
    <span class="stream-tool-pill__name" [attr.title]="nameTitle() || name()">{{ name() }}</span>
  }
  @if (meta()) {
    <span class="stream-tool-pill__sep" aria-hidden="true">·</span>
    <span class="stream-tool-pill__meta" [attr.title]="meta()">{{ meta() }}</span>
  }
  @if (expandable()) {
    <span class="stream-tool-pill__chevron" aria-hidden="true">{{ expanded() ? '▼' : '▶' }}</span>
  }
</button>
