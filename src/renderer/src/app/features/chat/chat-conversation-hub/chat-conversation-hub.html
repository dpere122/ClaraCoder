@if (collapsed()) {
  <div class="chat-hub chat-hub--collapsed">
    <button
      type="button"
      class="chat-hub__uncollapse"
      [attr.aria-pressed]="false"
      aria-label="Expand chat sidebar"
      title="Expand chat"
      (click)="toggleCollapsed()"
    >
      <lucide-icon name="chevron-left" [size]="16" />
    </button>
  </div>
} @else {
  <div class="chat-hub">
    <div class="chat-hub__toolbar">
      @if (showingList()) {
        <h2 class="chat-hub__title chat-hub__title--section">Conversations</h2>
      } @else {
        <h2 class="chat-hub__title" [attr.title]="activeConversationTitle()">{{ activeConversationTitle() }}</h2>
      }

      <button
        type="button"
        class="chat-hub__new-conv"
        aria-label="New conversation"
        title="New conversation"
        [disabled]="busy()"
        [attr.aria-busy]="creatingConversation() ? true : null"
        (click)="newConversation.emit()"
      >
        <lucide-icon name="square-pen" [size]="15" />
      </button>

      @if (!expanded()) {
        <button
          type="button"
          class="chat-hub__conv-toggle"
          [attr.aria-pressed]="view() === 'conversations'"
          [attr.aria-label]="view() === 'conversations' ? 'Show active chat' : 'Show conversations'"
          [title]="view() === 'conversations' ? 'Active chat' : 'Conversations'"
          (click)="toggleView()"
        >
          <lucide-icon [name]="view() === 'conversations' ? 'message-square' : 'list'" [size]="15" />
        </button>
      }

      <button
        type="button"
        class="chat-hub__expand"
        [disabled]="view() !== 'activeChat'"
        [attr.aria-pressed]="expanded()"
        [attr.aria-label]="expanded() ? 'Collapse chat to sidebar' : 'Expand chat to main panel'"
        [title]="expanded() ? 'Collapse chat' : 'Expand chat'"
        (click)="toggleExpanded()"
      >
        <lucide-icon [name]="expanded() ? 'minimize-2' : 'maximize-2'" [size]="15" />
      </button>

      <button
        type="button"
        class="chat-hub__collapse"
        aria-label="Collapse chat sidebar"
        title="Collapse chat"
        (click)="toggleCollapsed()"
      >
        <lucide-icon name="chevron-right" [size]="15" />
      </button>
    </div>

    <div class="chat-hub__body-wrap" [class.chat-hub__body-wrap--loading]="busy()">
      @if (showingList()) {
        <app-conversation-manager
          class="chat-hub__body"
          [attr.inert]="sidecarLoading() ? '' : null"
          [conversations]="conversations()"
          [activeId]="activeConversationId()"
          [activity]="conversationActivity()"
          (selectConversation)="onSelectFromList($event)"
          (deleteConversation)="deleteConversation.emit($event)"
          (renameConversation)="renameConversation.emit($event)"
        />
      } @else {
        <app-chat-active-stack
          class="chat-hub__body"
          [attr.inert]="sidecarLoading() ? '' : null"
          layout="sidebar"
          [messages]="messages()"
          [conversationId]="activeConversationId()"
          [loading]="loading()"
          [processingToolsActive]="processingToolsActive()"
          [ttsLoading]="ttsLoading()"
          [streamingParts]="streamingParts()"
          [streamingFinalText]="streamingFinalText()"
          [streamingPlanner]="streamingPlanner()"
          [fontSize]="fontSize()"
          (restoreConversation)="restoreConversation.emit($event)"
          (sendResponse)="sendResponse.emit($event)"
          (openTurnDiff)="openTurnDiff.emit($event)"
          (acceptCommandFinished)="acceptCommandFinished.emit($event)"
          (deleteReviewFinished)="deleteReviewFinished.emit($event)"
          (planConfirmFinished)="planConfirmFinished.emit($event)"
          (agentQuestionFinished)="agentQuestionFinished.emit($event)"
          (themeProposalFinished)="themeProposalFinished.emit($event)"
          [chatContextFiles]="chatContextFiles()"
          [workspaceRoot]="workspaceRoot()"
          (removeChatContextFile)="removeChatContextFile.emit($event)"
          (togglePinChatContextFile)="togglePinChatContextFile.emit($event)"
          (chatContextPathsDropped)="chatContextPathsDropped.emit($event)"
          [attachmentCount]="attachmentCount()"
          [appConfig]="appConfig()"
          [talkInputDeviceId]="talkInputDeviceId()"
          [talkSilenceThresholdSec]="talkSilenceThresholdSec()"
          [(talkEnabled)]="talkEnabled"
          [(talkStatus)]="talkStatus"
          [(talkModeDetailStatus)]="talkModeDetailStatus"
          (promptCaptured)="promptCaptured.emit($event)"
          (talkRecordingBegan)="talkRecordingBegan.emit()"
          (talkCaptureFinished)="talkCaptureFinished.emit($event)"
          [(composerMode)]="composerMode"
          [(composerDraft)]="composerDraft"
          [voiceActive]="voiceActive()"
          (voiceToggle)="voiceToggle.emit()"
          [contextBlocked]="contextBlocked()"
          (messageSent)="messageSent.emit($event)"
          (abortRequested)="abortRequested.emit()"
          [usedTokens]="usedTokens()"
          [maxTokens]="maxTokens()"
          [remainingTokens]="remainingTokens()"
          [usedPercentage]="usedPercentage()"
          [(autoApplyMode)]="autoApplyMode"
          [(adminElevationGranted)]="adminElevationGranted"
          [adminElevationPending]="adminElevationPending()"
          (adminGrantRequested)="adminGrantRequested.emit()"
          (reasoningEffortChange)="reasoningEffortChange.emit($event)"
          [composerThinking]="composerThinking()"
        />
      }
      @if (busy()) {
        <div
          class="chat-hub__loading-overlay"
          role="status"
          aria-live="polite"
          [attr.aria-label]="sidecarLoading() ? 'Starting backend' : 'Starting new conversation'"
        >
          <app-grid-spinner class="chat-hub__loading-spinner" />
          @if (sidecarLoading()) {
            <span class="chat-hub__loading-text" aria-hidden="true">Starting backend…</span>
          }
        </div>
      }
    </div>
  </div>
}
