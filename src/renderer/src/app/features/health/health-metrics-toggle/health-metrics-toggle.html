<label class='health-metrics-toggle'>
  <span class='health-metrics-toggle__copy'>
    <span class='health-metrics-toggle__label'>Live stats</span>
    <span class='health-metrics-toggle__hint'>Enable CPU, memory, network, disk, and GPU polling.</span>
  </span>
  <span class='health-metrics-toggle__control'>
    <input type='checkbox' [checked]='enabled()' (change)='onToggle($event)' />
    <span>{{ enabled() ? 'On' : 'Off' }}</span>
  </span>
</label>
