<div class='workspace'>
  <div class='workspace-header'>
    <select class='workspace-select' (change)='onWorkspaceSelectChange($event)'>
      <option value=''>No workspace</option>
      @for (ws of workspaces(); track ws.id) {
        <option [value]='ws.id' [selected]='ws.id === currentWorkspaceId()'>{{ ws.name }}</option>
      }
    </select>

    <div class='workspace-toolbar'>
      <button
        class='workspace-icon-btn'
        type='button'
        title='Add workspace'
        aria-label='Add workspace'
        (click)='onAddWorkspace()'
      >
        <lucide-icon name='folder-plus' [size]='17' />
      </button>
    </div>
  </div>

  @if (currentWorkspaceId()) {
    <div class='file-tree'>
      @if (lastWorkspaceChange()) {
        <p class='workspace-change-indicator'>Updated: {{ lastWorkspaceChange() }}</p>
      }
      @if (loadError()) {
        <p class='empty-hint'>{{ loadError() }}</p>
      } @else {
        @for (node of flatTree(); track node.path) {
          <div
            class='tree-node'
            [style.padding-left.rem]='0.5 + node.depth * 1'
            [class.is-directory]='node.isDirectory'
            (click)='onTreeNodeClick(node)'
          >
            @if (node.isDirectory) {
              <lucide-icon
                class='node-chevron'
                [name]="node.expanded ? 'chevron-down' : 'chevron-right'"
                [size]='12'
              />
              <lucide-icon name='folder' class='folder-icon' [size]='14' />
            } @else {
              <span class='node-chevron-spacer'></span>
              <lucide-icon name='file-text' class='file-icon' [size]='14' />
            }
            <span class='node-name'>{{ node.name }}</span>
          </div>
        } @empty {
          <p class='empty-hint'>// No files found.</p>
        }
      }
    </div>
  }
</div>
