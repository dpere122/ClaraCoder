<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="spinnerTitle">
  <title id="spinnerTitle">Writing</title>
  <style>
    .guide {
      fill: none;
      stroke: #a8b89a;
      stroke-opacity: 0.16;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .line {
      fill: none;
      stroke: #a8b89a;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    .line-1 { animation: jot-1 2.2s ease-in-out infinite; }
    .line-2 { animation: jot-2 2.2s ease-in-out infinite; }

    .pen {
      animation: pen-jot 2.2s ease-in-out infinite;
    }

    @keyframes jot-1 {
      0%, 2% { stroke-dashoffset: 100; }
      38% { stroke-dashoffset: 0; }
      86% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    @keyframes jot-2 {
      0%, 38% { stroke-dashoffset: 100; }
      78% { stroke-dashoffset: 0; }
      86% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    @keyframes pen-jot {
      0%, 2% { transform: translate(8px, 22px) rotate(-30deg); }
      12% { transform: translate(20px, 19px) rotate(-24deg); }
      24% { transform: translate(36px, 24px) rotate(-34deg); }
      38% { transform: translate(56px, 21px) rotate(-26deg); }
      42% { transform: translate(9px, 42px) rotate(-28deg); }
      54% { transform: translate(22px, 39px) rotate(-22deg); }
      66% { transform: translate(38px, 44px) rotate(-32deg); }
      78% { transform: translate(52px, 42px) rotate(-27deg); }
      86% { transform: translate(52px, 42px) rotate(-36deg); }
      100% { transform: translate(8px, 22px) rotate(-30deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .line-1, .line-2, .pen { animation: none; }
      .line { stroke-dashoffset: 0; }
      .pen { transform: translate(52px, 42px) rotate(-28deg); }
    }
  </style>

  <path
    class="guide"
    d="M8 21.5 C14 16.5 18 27 25 21.2 C31 16.6 34 26.8 42 21 C48 16.8 52 25.5 56.5 21.2"
  />
  <path
    class="guide"
    d="M8 42 C15 36.4 19 48 27 41.6 C34 36.2 38 47.4 46 41.8 C50 39 53 46.2 56 42.4"
  />

  <path
    class="line line-1"
    pathLength="100"
    d="M8 21.5 C14 16.5 18 27 25 21.2 C31 16.6 34 26.8 42 21 C48 16.8 52 25.5 56.5 21.2"
  />
  <path
    class="line line-2"
    pathLength="100"
    d="M8 42 C15 36.4 19 48 27 41.6 C34 36.2 38 47.4 46 41.8 C50 39 53 46.2 56 42.4"
  />

  <g class="pen">
    <rect x="-2.15" y="-20" width="4.3" height="14.2" rx="1.35" fill="#a8b89a"/>
    <rect x="-2.15" y="-7.4" width="4.3" height="2.3" fill="#c9a96e"/>
    <path d="M-2.15 -5.1 L2.15 -5.1 L0 0 Z" fill="#d8c8a0"/>
    <path d="M-0.9 -2.1 L0.9 -2.1 L0 0 Z" fill="#7eb5a6"/>
  </g>
</svg>
