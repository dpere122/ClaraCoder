@if (show()) {
  <div
    class="managed-llama-controls"
    [class.managed-llama-controls--status-bar]="layout() === 'status-bar'"
    role="group"
    aria-label="LLM source and managed llama-server controls"
  >
    <div class="managed-llama-controls__row" (pointerdown)="refreshSwitchable()" (focusin)="refreshSwitchable()">
      <app-pill-select
        class="managed-llama-controls__source-select"
        [class.is-glowing]="modelGlow()"
        [options]="sourceOptions()"
        [value]="selectedProviderId()"
        [disabled]="!statusBar() && (running() || busy())"
        [attr.aria-busy]="inventoryLoading() ? 'true' : null"
        [menuFitContent]="layout() === 'status-bar'"
        ariaLabel="Active LLM source"
        (valueChange)="onSourceChange($event)"
      />
      @if (showManagedStart() || switchPending()) {
      <button
        type="button"
        class="action-button action-button--primary managed-llama-controls__btn"
        [class.action-button--danger]="running() || busy() || switchPending()"
        [class.managed-llama-controls__btn--loading]="inventoryLoading()"
        [disabled]="!switchPending() && (!isLocalLlama() || !chatRunCommand().trim())"
        [attr.aria-busy]="inventoryLoading() ? 'true' : null"
        [attr.title]="switchPending() ? 'Make this the main agent\'s model' : null"
        (click)="onAction()"
      >
        <span
          class="managed-llama-controls__spinner-host"
          [class.is-active]="inventoryLoading()"
          role="status"
          aria-live="polite"
          [attr.aria-hidden]="inventoryLoading() ? null : 'true'"
          [attr.aria-label]="inventoryLoading() ? 'Loading source labels' : null"
        >
          <ngx-spinner
            [name]="inventorySpinnerName"
            [type]="inventorySpinnerType"
            [fullScreen]="false"
            bdColor="rgba(0,0,0,0)"
            size="small"
            color="var(--t-primary)"
          ></ngx-spinner>
        </span>
        <span class="managed-llama-controls__btn-label">{{ actionLabel() }}</span>
      </button>
      }
    </div>
    @if (startError()) {
      <div class="managed-llama-controls__error" role="alert"><span>{{ startError() }}</span></div>
      @if (layout() === 'status-bar') {
        <button
          type="button"
          class="managed-llama-controls__error-dismiss"
          title="Dismiss"
          aria-label="Dismiss start error"
          (click)="startError.set('')"
        >&times;</button>
      }
    }
  </div>
}
