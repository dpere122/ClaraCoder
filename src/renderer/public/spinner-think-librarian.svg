<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="spinnerTitle">
  <title id="spinnerTitle">Thinking</title>
  <style>
    .book {
      animation: scan 3.2s ease-in-out infinite;
    }
    .b2 { animation-delay: 0.12s; }
    .b4 { animation-delay: 0.36s; }
    .b5 { animation-delay: 0.48s; }
    .pick {
      animation: pick 3.2s ease-in-out infinite;
    }
    .pick-glow {
      animation: pick-glow 3.2s ease-in-out infinite;
    }
    .lean {
      transform-origin: 54.6px 49px;
      animation: lean 3.2s ease-in-out infinite;
    }

    /* Every spine lifts a hair in turn, like a finger running along the shelf. */
    @keyframes scan {
      0%, 16%, 100% { transform: translateY(0); }
      8% { transform: translateY(-2.4px); }
    }
    /* The chosen volume lifts with the scan, then slides out, is held, and goes back. */
    @keyframes pick {
      0% { transform: translateY(0); }
      8% { transform: translateY(-2.4px); }
      14% { transform: translateY(-1px); }
      32%, 66% { transform: translateY(-11px); }
      84%, 100% { transform: translateY(0); }
    }
    @keyframes pick-glow {
      0%, 18% { opacity: 0; }
      32%, 66% { opacity: 1; }
      84%, 100% { opacity: 0; }
    }
    /* The last book settles back against its neighbour once the gap closes. */
    @keyframes lean {
      0%, 30% { transform: rotate(0deg); }
      40%, 70% { transform: rotate(-3deg); }
      82%, 100% { transform: rotate(0deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .book, .pick, .pick-glow, .lean { animation: none; }
      .pick { transform: translateY(-11px); }
      .pick-glow { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="ccShelf" x1="8" y1="0" x2="56" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a8b89a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a8b89a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a8b89a" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ccGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Spines: fill tint, outline, and a band near the head and foot. -->
  <g class="book b1">
    <rect x="9.5" y="21" width="6.5" height="28" rx="1.2" fill="#a8b89a" fill-opacity="0.12" stroke="#a8b89a" stroke-opacity="0.7" stroke-width="1.7"/>
    <path d="M11.6 25.5h2.3M11.6 44.5h2.3" stroke="#a8b89a" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g class="book b2">
    <rect x="17.5" y="16.5" width="5.5" height="32.5" rx="1.2" fill="#c9a96e" fill-opacity="0.12" stroke="#c9a96e" stroke-opacity="0.75" stroke-width="1.7"/>
    <path d="M19.3 21h1.9M19.3 44.5h1.9" stroke="#c9a96e" stroke-opacity="0.6" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- The volume being fetched. -->
  <g class="pick">
    <rect class="pick-glow" x="24.5" y="22" width="8" height="27" rx="1.4" fill="#7eb5a6" fill-opacity="0.22" filter="url(#ccGlow)"/>
    <rect x="24.5" y="22" width="8" height="27" rx="1.4" fill="#7eb5a6" fill-opacity="0.16" stroke="#7eb5a6" stroke-width="1.9"/>
    <path d="M26.8 27h3.4M26.8 44h3.4" stroke="#7eb5a6" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="28.5" cy="35.5" r="1.3" fill="#d8c8a0"/>
  </g>

  <g class="book b4">
    <rect x="34" y="19" width="5.5" height="30" rx="1.2" fill="#a8b89a" fill-opacity="0.12" stroke="#a8b89a" stroke-opacity="0.7" stroke-width="1.7"/>
    <path d="M35.8 23.5h1.9M35.8 44.5h1.9" stroke="#a8b89a" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g class="book b5">
    <rect x="41" y="23.5" width="6.5" height="25.5" rx="1.2" fill="#d8c8a0" fill-opacity="0.1" stroke="#d8c8a0" stroke-opacity="0.6" stroke-width="1.7"/>
    <path d="M43.1 28h2.3M43.1 44.5h2.3" stroke="#d8c8a0" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Leaning bookend volume. -->
  <g class="lean">
    <rect x="49" y="26" width="5.6" height="23" rx="1.2" transform="rotate(14 54.6 49)" fill="#a8b89a" fill-opacity="0.08" stroke="#a8b89a" stroke-opacity="0.45" stroke-width="1.7"/>
  </g>

  <!-- Shelf -->
  <path d="M7 51h50" stroke="url(#ccShelf)" stroke-width="2.6" stroke-linecap="round"/>
</svg>
