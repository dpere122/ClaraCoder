<div class="composer-context">
  <app-chat-context-bar
    [files]="contextFiles()"
    [workspaceRoot]="workspaceRoot()"
    (removeFile)="removeContextFile.emit($event)"
    (togglePinFile)="togglePinContextFile.emit($event)"
    (pathsDropped)="contextPathsDropped.emit($event)"
  />
</div>
@if (talkStatus() || talkDetail()) {
  <div class="talk-status">
    <span class="talk-status-dot"></span>
    <span class="talk-status-text">{{ talkStatus() || talkDetail() }}</span>
  </div>
}
<div class="composer-stack" (mousedown)="onComposerMouseDown($event)">
  <div class="composer-entry-row">
    <div
      class="composer-input-wrap"
      [class.composer-input-wrap--multiline]="multilineMode()"
    >
      <button
        type="button"
        class="composer-prompt"
        [class.composer-prompt--active]="multilineMode()"
        [attr.aria-pressed]="multilineMode()"
        [title]="multilineMode() ? 'Multiline: Enter for new line · Shift+Enter to send' : 'Shift+Enter for multiline · Enter to send'"
        aria-label="Toggle multiline input"
        (mousedown)="onPromptMouseDown($event)"
        (click)="toggleMultilineMode($event)"
      >&gt;</button>
      @if (multilineMode()) {
        <textarea
          #messageInput
          class="form-control form-control--multiline"
          rows="1"
          [ngModel]="composerDraft()"
          (ngModelChange)="composerDraft.set($event)"
          (keydown)="onComposerKeydown($event)"
          (input)="onTextareaInput()"
          [disabled]="contextBlocked()"
          [placeholder]="contextBlocked() ? 'Context full — start a new conversation to continue' : ''"
        ></textarea>
      } @else {
        <input
          #messageInput
          type="text"
          class="form-control"
          [ngModel]="composerDraft()"
          (ngModelChange)="composerDraft.set($event)"
          (keydown)="onSingleLineKeydown($event)"
          [disabled]="contextBlocked()"
          [placeholder]="contextBlocked() ? 'Context full — start a new conversation to continue' : ''"
        />
      }
    </div>
    @if (loading()) {
      <button class="btn btn-abort" type="button" (click)="abort()" title="Stop generation">
        <lucide-icon name="square" [size]="16" class="stop-icon"></lucide-icon>
      </button>
    } @else {
      <button class="btn btn-send" type="button" (click)="send()" [disabled]="sendDisabled()" [title]="sendTitle()">
        SEND >>
      </button>
    }
  </div>
  <div class="composer-options-row">
    <span class="composer-voice-wrap" title="Coming soon">
      <button
        type="button"
        class="btn btn-voice"
        disabled
        aria-label="Coming soon"
      >
        <lucide-icon name="mic" [size]="18" class="voice-mic-icon"></lucide-icon>
      </button>
    </span>
    @if (showReasoningCluster()) {
      <div class="composer-reasoning-cluster">
        @if (thinkingVisible()) {
          <button
            type="button"
            class="btn btn-reasoning"
            [class.btn-reasoning--active]="reasoningEnabled()"
            [attr.aria-pressed]="reasoningEnabled()"
            (click)="onReasoningToggle()"
            title="{{ reasoningEnabled() ? 'Reasoning on — click to turn off' : 'Reasoning off — click to turn on' }}"
            aria-label="Toggle reasoning"
          >
            <lucide-icon name="brain" [size]="16" class="composer-reasoning-icon" aria-hidden="true"></lucide-icon>
          </button>
        }
        @if (effortVisible()) {
          <div class="composer-mode-wrap composer-reasoning-wrap">
            <select
              class="composer-mode-select composer-reasoning-select"
              [ngModel]="reasoningEffort()"
              (ngModelChange)="onReasoningEffortChange($event)"
              [disabled]="thinkingVisible() && !reasoningEnabled()"
              title="Reasoning effort"
              aria-label="Reasoning effort"
            >
              @for (opt of reasoningEffortOptions(); track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
            <lucide-icon name="chevron-down" [size]="14" class="composer-mode-chevron" aria-hidden="true"></lucide-icon>
          </div>
        }
      </div>
    }
    <div class="composer-mode-wrap">
      <select
        class="composer-mode-select"
        [ngModel]="composerMode()"
        (ngModelChange)="composerMode.set($event)"
        title="Run mode: Agent executes directly; Ask is read-only; Plan drafts steps first."
        aria-label="Composer run mode"
      >
        @for (mode of composerModes; track mode) {
          <option [value]="mode">{{ composerModeLabels[mode] }}</option>
        }
      </select>
      <lucide-icon name="chevron-down" [size]="14" class="composer-mode-chevron" aria-hidden="true"></lucide-icon>
    </div>
    @if (composerMode() !== 'ask') {
      <div class="composer-toggle-chips">
        <button
          type="button"
          class="composer-chip composer-chip--auto"
          [class.composer-chip--active]="autoApplyMode()"
          [attr.aria-pressed]="autoApplyMode()"
          title="Run tool calls and apply edits automatically without side-by-side review in chat"
          (click)="autoApplyMode.set(!autoApplyMode())"
        >
          Auto Run
        </button>
        <button
          type="button"
          class="composer-chip composer-chip--admin"
          [class.composer-chip--active]="adminElevationGranted()"
          [class.composer-chip--pending]="adminElevationPending()"
          [attr.aria-pressed]="adminElevationGranted()"
          [title]="
            adminElevationGranted()
              ? 'This agent has administrator/root shell access for this conversation. Click to revoke.'
              : adminElevationPending()
                ? 'Waiting for confirmation to grant this agent administrator access.'
                : 'Grant this agent administrator/root shell access for this conversation.'
          "
          (click)="onAdminChipClick()"
        >
          <lucide-icon name="shield" [size]="12" class="composer-chip-icon" aria-hidden="true"></lucide-icon>
          Admin
        </button>
      </div>
    }
    <div class="composer-status-cluster">
      <app-context-capacity
        [compact]="true"
        [appConfig]="appConfig()"
        [usedTokens]="usedTokens()"
        [maxTokens]="maxTokens()"
        [remainingTokens]="remainingTokens()"
        [usedPercentage]="usedPercentage()"
      />
    </div>
  </div>
</div>
