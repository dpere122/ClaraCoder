<div
  class="stream-brief-pill"
  [class.stream-brief-pill--previewing]="panelOpen()"
  [class.stream-brief-pill--inline]="keepRendered() && !showPreview()"
>
  @if (live() || keepRendered()) {
    <div
      class="stream-brief-preview"
      [class.stream-brief-preview--open]="panelOpen()"
    >
      <div class="stream-brief-preview__inner">
        <button
          type="button"
          class="stream-brief-preview__header"
          [attr.aria-expanded]="panelOpen()"
          (click)="toggle()"
        >
          {{ label() }}
        </button>
        <pre #previewBody class="stream-brief-preview__body">{{ text() }}@if (showPreview()) {<span class="streaming-cursor streaming-cursor--live" aria-hidden="true"></span>}</pre>
      </div>
    </div>
  }
  <div class="stream-brief-pill__chip" [hidden]="panelOpen()">
    <app-stream-tool-pill
      [name]="label()"
      [state]="pillState()"
      [expandable]="true"
      [expanded]="expanded()"
      [live]="live()"
      (toggle)="toggle()"
    />
    @if (expanded() && !panelOpen()) {
      <pre class="llm-reasoning-body stream-brief-pill__body">{{ text() }}</pre>
    }
  </div>
</div>
