<!-- A separate class keeps the fading copy distinct from the mascot at its current location. -->
@for (point of departures; track point) {
  <div
    class="tutorial-mascot-departure"
    aria-hidden="true"
    [style.--tutorial-mascot-x]="point.x + 'px'"
    [style.--tutorial-mascot-y]="point.y + 'px'"
    [style.--tutorial-mascot-scale]="validScale"
    (animationend)="departures = []"
  >
    <img class="tutorial-mascot__mark" src="app-icon-etch.png" alt="" draggable="false" />
  </div>
}
@if (validDestination; as point) {
  <!-- Recreate the single view on a new key to replay its CSS animations without timers. -->
  @for (key of [transitionKey]; track 'tutorial-mascot:' + key) {
    <div
      class="tutorial-mascot"
      aria-hidden="true"
      [class.tutorial-mascot--celebrating]="celebration"
      [style.--tutorial-mascot-x]="point.x + 'px'"
      [style.--tutorial-mascot-y]="point.y + 'px'"
      [style.--tutorial-mascot-scale]="validScale"
    >
      <img class="tutorial-mascot__mark" src="app-icon-etch.png" alt="" draggable="false" />
      @if (celebration) {
        <div class="tutorial-mascot__celebration">
          <span class="tutorial-mascot__ring tutorial-mascot__ring--outer"></span>
          <span class="tutorial-mascot__ring tutorial-mascot__ring--inner"></span>
          <div class="tutorial-mascot__rays">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="tutorial-mascot__sparkles">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="tutorial-mascot__confetti">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      }
    </div>
  }
}
