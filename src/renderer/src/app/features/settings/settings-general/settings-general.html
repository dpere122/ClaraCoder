      <div class='settings-pane settings-pane--sectioned'>

        @if (s.activeSubTabId('general') === 'chat') {
          <div class='form-section'>
            <div class='form-grid'>
              <div
                class='field settings-general-font'
                title='Scales rem-based app UI text — sidebar, toolbar, dialogs, and settings. Does not change Monaco or the terminal.'
              >
                <span>App font size</span>
                <app-font-control
                  [fontSize]='s.uiFontSizeRem()'
                  [minSize]='s.uiFontSizeRemMin'
                  [maxSize]='s.uiFontSizeRemMax'
                  [step]='s.uiFontSizeRemStep'
                  [defaultSize]='s.uiFontSizeRemDefault'
                  (fontSizeChange)='s.onUiFontSizeRemChange($event)'
                />
              </div>
              <div
                class='field settings-general-font'
                title='Font size for message text in the chat area.'
              >
                <span>Chat font size</span>
                <app-font-control
                  [fontSize]='s.chatFontSizeRem()'
                  (fontSizeChange)='s.onChatFontSizeRemChange($event)'
                />
              </div>
              <label
                class='field'
                title='Content width when chat is expanded to the main panel. Sidebar chat is always full width.'
              >
                <span>Chat container size</span>
                <app-pill-select
                  [options]='s.chatContainerSizeOptions'
                  valueKey='value'
                  [value]='s.chatContainerSize()'
                  (valueChange)='s.onChatContainerSizeChange($any($event))'
                />
              </label>
              <label
                class='field'
                title='Live preview streams the model reasoning in a box while it thinks. Compact pill shows a timed "Thinking" pill instead, which becomes a "Thought" pill you can click to read the reasoning.'
              >
                <span>Thinking display</span>
                <app-pill-select
                  [options]='s.chatThinkingDisplayOptions'
                  valueKey='value'
                  [value]='s.chatThinkingDisplay()'
                  (valueChange)='s.onChatThinkingDisplayChange($any($event))'
                />
              </label>
              <label
                class='field'
                title='App font: applies to all app UI text — chat messages, buttons, menus, and dialogs — everywhere except the Monaco editor and rendered code blocks, which use the Code font below. Includes your OS-installed fonts under "System fonts".'
              >
                <span>App font</span>
                <app-pill-select
                  [options]='fontOptions(s.uiFontFamilyOptions, s.systemFontOptions())'
                  [value]='s.uiFontFamily()'
                  (valueChange)='s.onUiFontFamilyChange($event)'
                />
              </label>
              <label
                class='field'
                title='Code font: applies to rendered code blocks in chat and overrides the font family set on the Monaco tab (Settings → Monaco → Typography) when not left on Theme default. Includes your OS-installed fonts under "System fonts".'
              >
                <span>Code font</span>
                <app-pill-select
                  [options]='fontOptions(s.codeFontFamilyOptions, s.systemFontOptions())'
                  [value]='s.codeFontFamily()'
                  (valueChange)='s.onCodeFontFamilyChange($event)'
                />
              </label>
            </div>
          </div>
        }
          

      </div>
