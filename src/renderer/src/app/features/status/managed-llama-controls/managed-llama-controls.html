@if (show()) {
  <div class="managed-llama-controls" role="group" aria-label="LLM source and managed llama-server controls">
    <div class="managed-llama-controls__row">
      <app-pill-select
        class="managed-llama-controls__source-select"
        [options]="sourceOptions()"
        [value]="activeProviderId()"
        [disabled]="running() || busy()"
        [attr.aria-busy]="inventoryLoading() ? 'true' : null"
        ariaLabel="Active LLM source"
        (valueChange)="onSourceChange($event)"
      />
      @if (showManagedStart()) {
      <button
        type="button"
        class="action-button action-button--primary managed-llama-controls__btn"
        [class.action-button--danger]="running() || busy()"
        [class.managed-llama-controls__btn--loading]="inventoryLoading()"
        [disabled]="!isLocalLlama() || !chatRunCommand().trim()"
        [attr.aria-busy]="inventoryLoading() ? 'true' : null"
        (click)="toggle()"
      >
        <span
          class="managed-llama-controls__spinner-host"
          [class.is-active]="inventoryLoading()"
          role="status"
          aria-live="polite"
          [attr.aria-hidden]="inventoryLoading() ? null : 'true'"
          [attr.aria-label]="inventoryLoading() ? 'Loading source labels' : null"
        >
          <ngx-spinner
            [name]="inventorySpinnerName"
            [type]="inventorySpinnerType"
            [fullScreen]="false"
            bdColor="rgba(0,0,0,0)"
            size="small"
            color="var(--t-primary)"
          ></ngx-spinner>
        </span>
        <span class="managed-llama-controls__btn-label">{{ actionLabel() }}</span>
      </button>
      }
    </div>
  </div>
}
