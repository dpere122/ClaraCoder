<div class="theme-selector">
  <label class="theme-label" for="themeSelect">{{ themeLabel() }}</label>
  <select
    id="themeSelect"
    class="theme-dropdown"
    [ngModel]="themeId()"

    (ngModelChange)="onThemeChange($event)"
  >
    @for (t of themes; track t.id) {
      <option [value]="t.id">{{ t.label }}</option>
    }
  </select>
</div>
